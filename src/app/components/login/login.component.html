<div class="container">
    <form class="form mat-elevation-z10">
                    
            <img src="https://www.hubtel.com.br/template/Site/assets/images/logo.png" style="width: 40%; height: 40%; display: block;">

            <mat-form-field class="full-width" appearance="fill">
                <mat-label>Email</mat-label>
                <input [formControl]= "username" required [(ngModel)]="creds.username" name="username" matInput placeholder="exemplo@gmail.com" >
            </mat-form-field>

            <mat-form-field class="full-width" appearance="fill">
                <mat-label>Senha</mat-label>
                <input [formControl]= "password" required [(ngModel)]="creds.password" name="password" matInput type="password" placeholder="**********">
            </mat-form-field>

            <button (click)="logar()" [disabled]="!validaCampos()" class="full-width mat-elevation-z4" mat-stroked-button color="primary">Login</button>
        </form>
              
</div>
